  <title>Medical Wiki</title>
  <style>
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --text-main: #e0e0e0;
      --text-sub: #a0a0a0;
      --accent: #64b5f6;
      --border: #333333;
      --header-bg: #1f1f1f;
    }
    body {
      margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
      background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding-top: 110px;
    }
    * { box-sizing: border-box; }
    
    /* Header & Search */
    header {
      position: fixed; top: 0; left: 0; right: 0; background: var(--header-bg); border-bottom: 1px solid var(--border);
      padding: 10px 15px; z-index: 1000;
    }
    .header-title { font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 8px; color: #fff; cursor: pointer;}
    .search-container { position: relative; }
    #search-input {
      width: 100%; padding: 12px; border-radius: 8px; border: none; background: #333; color: #fff; font-size: 16px; /* 16px to prevent iOS zoom */
    }
    #search-results {
      position: absolute; top: 100%; left: 0; right: 0; background: var(--surface-color); border: 1px solid var(--border);
      border-radius: 4px; max-height: 300px; overflow-y: auto; display: none; z-index: 1001; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    }
    .search-item { padding: 12px; border-bottom: 1px solid var(--border); color: var(--accent); display: block; text-decoration: none; }
    
    /* Content Area */
    #app { padding: 15px; padding-bottom: 50px; }
    h1 { font-size: 1.5rem; border-bottom: 2px solid var(--accent); padding-bottom: 5px; margin-top: 0;}
    h2 { font-size: 1.2rem; color: #fff; background: #2c2c2c; padding: 8px; border-left: 4px solid var(--accent); margin-top: 20px;}
    
    /* Breadcrumb & Navigation */
    .nav-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem;}
    .back-btn { color: var(--accent); text-decoration: none; display: flex; align-items: center; padding: 5px 0;}
    .breadcrumb { color: var(--text-sub); }
    
    /* Links */
    a.wiki-link { color: var(--accent); text-decoration: none; font-weight: bold; padding: 2px 4px; background: rgba(100, 181, 246, 0.1); border-radius: 4px;}
    a.wiki-link:active { background: rgba(100, 181, 246, 0.3); }
    
    /* Flowchart */
    .flow-container { display: flex; flex-direction: column; align-items: center; margin: 20px 0; font-size: 0.9rem;}
    .flow-box {
      background: var(--surface-color); border: 1px solid var(--accent); color: var(--accent); padding: 12px;
      border-radius: 8px; text-align: center; width: 90%; text-decoration: none; font-weight: bold; margin: 5px 0;
    }
    .flow-text { margin: 5px 0; text-align: center; color: var(--text-main); width: 90%; font-weight: bold;}
    .flow-arrow { margin: 2px 0; color: var(--text-sub); text-align: center; }
    .flow-row { display: flex; justify-content: space-between; width: 90%; gap: 10px; }
    .flow-row .flow-box { width: 100%; }
    
    /* Accordion (Oral Exam) */
    .qa-item { border: 1px solid var(--border); margin-bottom: 10px; border-radius: 6px; overflow: hidden;}
    .qa-q { background: #2a2a2a; padding: 15px; font-weight: bold; cursor: pointer; color: #fff; }
    .qa-a { background: var(--bg-color); padding: 15px; display: none; border-top: 1px solid var(--border);}
    
    /* Related Items */
    .related-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .related-tag { background: #333; color: var(--text-main); padding: 8px 12px; border-radius: 20px; text-decoration: none; font-size: 0.9rem;}
    
    /* Top Page Menu */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .menu-btn { background: var(--surface-color); border: 1px solid var(--border); padding: 15px; text-align: center; border-radius: 8px; color: var(--text-main); text-decoration: none; font-weight: bold;}
  </style>
</head>

    // ==========================================
    // アプリケーション ロジック
    // ==========================================
    const appDiv = document.getElementById('app');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    // 検索機能
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      searchResults.innerHTML = '';
      if (query.length === 0) {
        searchResults.style.display = 'none';
        return;
      }
      let matches = 0;
      for (const [key, data] of Object.entries(db)) {
        if (key === 'home') continue;
        if (data.title.toLowerCase().includes(query) || (data.overview && data.overview.toLowerCase().includes(query))) {
          const a = document.createElement('a');
          a.href = `#${key}`;
          a.className = 'search-item';
          a.textContent = data.title;
          a.onclick = () => { searchInput.value = ''; searchResults.style.display = 'none'; };
          searchResults.appendChild(a);
          matches++;
        }
      }
      searchResults.style.display = matches > 0 ? 'block' : 'none';
    });

    // アコーディオンのトグル
    window.toggleQA = function(el) {
      const answer = el.nextElementSibling;
      if(answer.style.display === "block") {
        answer.style.display = "none";
      } else {
        answer.style.display = "block";
      }
    };

    // ページ描画
    function renderPage(id) {
      if (!db[id]) id = 'home';
      const data = db[id];
      window.scrollTo(0, 0);

      // カスタムHTMLが定義されていればそのまま表示（トップページなど）
      if (data.html) {
        appDiv.innerHTML = data.html;
        return;
      }

      // Wikiページの構築
      let html = `<div class="nav-bar">
                    <a href="javascript:history.back()" class="back-btn">← 前のページ</a>
                    <span class="breadcrumb">ホーム > ${data.title}</span>
                  </div>`;
      html += `<h1>${data.title}</h1>`;
      
      if (data.overview) {
        html += `<h2>概要</h2><p>${data.overview}</p>`;
      }

      if (data.sections && data.sections.length > 0) {
        data.sections.forEach(sec => {
          html += `<h2>${sec.title}</h2><p>${sec.content}</p>`;
        });
      }

      if (data.qa && data.qa.length > 0) {
        html += `<h2>研修医口頭試問</h2>`;
        data.qa.forEach(item => {
          html += `<div class="qa-item">
                     <div class="qa-q" onclick="toggleQA(this)">Q. ${item.q}</div>
                     <div class="qa-a">${item.a}</div>
                   </div>`;
        });
      }

      if (data.related && data.related.length > 0) {
        html += `<h2>関連項目</h2><div class="related-tags">`;
        data.related.forEach(rel => {
          if(db[rel]) {
            html += `<a href="#${rel}" class="related-tag">${db[rel].title}</a>`;
          }
        });
        html += `</div>`;
      }
      
      html += `<h2>参考文献</h2><p style="font-size:0.85rem; color:var(--text-sub);">
        ・2023 ESC Guidelines for the management of acute coronary syndromes<br>
        ・2024 ESC Guidelines for the management of chronic coronary syndromes<br>
        ・日本循環器学会 フォーカスアップデート版ガイドライン<br>
        ※記載の数値・推奨は最新の原典を<span style="color:#ffb74d;">要確認</span>。
      </p>`;

      appDiv.innerHTML = html;
    }

    // 画面遷移（ハッシュ変更）の検知
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '');
      renderPage(hash || 'home');
    });

    window.navigate = function(id) {
      window.location.hash = id;
    };

    // 初期化
    const initialHash = window.location.hash.replace('#', '');
    renderPage(initialHash || 'home');
  </script>
</body>
</html>
