<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Medical Wiki">
  <title>Medical Wiki</title>
  <style>
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --text-main: #e0e0e0;
      --text-sub: #a0a0a0;
      --accent: #64b5f6;
      --border: #333333;
      --header-bg: #1f1f1f;
    }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding-top: 110px; }
    * { box-sizing: border-box; }
    
    /* Header & Search */
    header { position: fixed; top: 0; left: 0; right: 0; background: var(--header-bg); border-bottom: 1px solid var(--border); padding: 10px 15px; z-index: 1000; }
    .header-title { font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 8px; color: #fff; cursor: pointer;}
    .search-container { position: relative; }
    #search-input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #333; color: #fff; font-size: 16px; }
    #search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface-color); border: 1px solid var(--border); border-radius: 4px; max-height: 300px; overflow-y: auto; display: none; z-index: 1001; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
    .search-item { padding: 12px; border-bottom: 1px solid var(--border); color: var(--accent); display: block; text-decoration: none; }
    
    /* Content Area */
    #app { padding: 15px; padding-bottom: 50px; }
    h1 { font-size: 1.5rem; border-bottom: 2px solid var(--accent); padding-bottom: 5px; margin-top: 0;}
    h2 { font-size: 1.2rem; color: #fff; background: #2c2c2c; padding: 8px; border-left: 4px solid var(--accent); margin-top: 20px;}
    
    /* Breadcrumb & Navigation */
    .nav-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem;}
    .back-btn { color: var(--accent); text-decoration: none; display: flex; align-items: center; padding: 5px 0;}
    .breadcrumb { color: var(--text-sub); }
    .breadcrumb a { color: var(--text-sub); text-decoration: none; }
    
    /* Links */
    a.wiki-link { color: var(--accent); text-decoration: none; font-weight: bold; padding: 2px 4px; background: rgba(100, 181, 246, 0.1); border-radius: 4px;}
    
    /* Flowchart */
    .flow-container { display: flex; flex-direction: column; align-items: center; margin: 20px 0; font-size: 0.9rem;}
    .flow-box { background: var(--surface-color); border: 1px solid var(--accent); color: var(--accent); padding: 12px; border-radius: 8px; text-align: center; width: 90%; text-decoration: none; font-weight: bold; margin: 5px 0; display: block;}
    .flow-text { background: #333; padding: 12px; border-radius: 8px; margin: 5px 0; text-align: center; color: var(--text-main); width: 90%; font-weight: bold;}
    .flow-arrow { margin: 2px 0; color: var(--text-sub); text-align: center; font-weight: bold;}
    
    /* Accordion (Oral Exam) */
    .qa-item { border: 1px solid var(--border); margin-bottom: 10px; border-radius: 6px; overflow: hidden;}
    .qa-q { background: #2a2a2a; padding: 15px; font-weight: bold; cursor: pointer; color: #fff; }
    .qa-a { background: var(--bg-color); padding: 15px; display: none; border-top: 1px solid var(--border);}
    
    /* Top Page Menu & Related Items */
    .menu-grid, .related-tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .menu-btn { background: var(--surface-color); border: 1px solid var(--border); padding: 15px; text-align: center; border-radius: 8px; color: var(--text-main); text-decoration: none; font-weight: bold; width: calc(50% - 5px);}
    .related-tag { background: #333; color: var(--text-main); padding: 8px 12px; border-radius: 20px; text-decoration: none; font-size: 0.9rem;}
    .category-title-btn { width: 100%; background: #2c2c2c; color: #fff; margin-top: 10px; padding: 10px; text-align: center; border-radius: 4px; font-weight: bold; text-decoration: none;}
  </style>
</head>
<body>

  <header>
    <div class="header-title" onclick="window.location.hash='home'">MEDICAL WIKI</div>
    <div class="search-container">
      <input type="text" id="search-input" placeholder="医学用語を検索..." autocomplete="off">
      <div id="search-results"></div>
    </div>
  </header>

  <div id="app"></div>

  <script>
    // ==================================================
    // 1. APP CORE & CONTENT ENGINE
    // ==================================================
    
    // データベースとカテゴリマップ
    const db = {};
    const categoryMap = {};

    // テンプレートエンジン（自動生成する項目の定義）
    const sectionTemplates = [
      { key: 'overview', title: '概要' }, { key: 'definition', title: '定義' },
      { key: 'epidemiology', title: '疫学' }, { key: 'pathophysiology', title: '病態生理' },
      { key: 'riskFactors', title: '危険因子' }, { key: 'symptoms', title: '症状' },
      { key: 'historyTaking', title: '問診' }, { key: 'physicalExam', title: '身体診察' },
      { key: 'initialTests', title: '初期検査' }, { key: 'imaging', title: '画像所見' },
      { key: 'bloodTests', title: '血液検査' }, { key: 'diagnosisCriteria', title: '診断基準' },
      { key: 'severity', title: '重症度分類' }, { key: 'differential', title: '鑑別診断' },
      { key: 'treatment', title: '治療' }, { key: 'medication', title: '薬物療法' },
      { key: 'nonPharma', title: '非薬物療法' }, { key: 'surgery', title: '手術・処置' },
      { key: 'prognosis', title: '予後' }, { key: 'followUp', title: 'フォローアップ' },
      { key: 'importantPoints', title: '重要ポイント' }, { key: 'references', title: '参考文献' }
    ];

    // コンテンツ登録関数
    function addMedicalContent(data) {
      if (!data || !data.id) return;
      db[data.id] = data;
      
      if (data.category) {
        if (!categoryMap[data.category]) categoryMap[data.category] = [];
        if (!categoryMap[data.category].includes(data.id)) categoryMap[data.category].push(data.id);
      }
    }

    // アコーディオン動作
    window.toggleQA = function(el) {
      const answer = el.nextElementSibling;
      answer.style.display = answer.style.display === "block" ? "none" : "block";
    };

    // 検索機能
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      searchResults.innerHTML = '';
      if (!query) { searchResults.style.display = 'none'; return; }
      
      let matches = 0;
      for (const [id, data] of Object.entries(db)) {
        let isMatch = false;

        // 1. タイトルまたは概要に一致するか確認
        if (data.title.toLowerCase().includes(query) || (data.overview && data.overview.toLowerCase().includes(query))) {
          isMatch = true;
        } else {
          // 2. 本文・治療・口頭試問など、その他の全文章を結合して全文検索
          const allText = Object.values(data).map(val => {
            if (typeof val === 'string') return val;
            if (Array.isArray(val)) return JSON.stringify(val); // フローチャートや口頭試問の配列も文字列化
            return '';
          }).join(' ').toLowerCase();

          if (allText.includes(query)) {
            isMatch = true;
          }
        }

        // 一致した場合、検索結果に表示
        if (isMatch) {
          const a = document.createElement('a');
          a.href = `#${id}`;
          a.className = 'search-item';
          a.textContent = data.title;
          a.onclick = () => { searchInput.value = ''; searchResults.style.display = 'none'; };
          searchResults.appendChild(a);
          matches++;
        }
      }
      searchResults.style.display = matches > 0 ? 'block' : 'none';
    });

    // 画面描画ルーター
    function renderApp() {
      const hash = window.location.hash.replace('#', '');
      const appDiv = document.getElementById('app');
      window.scrollTo(0, 0);

      // トップページ
      if (!hash || hash === 'home') {
        let html = `<h1>診療科・カテゴリ</h1><div class="menu-grid">`;
        Object.keys(categoryMap).forEach(cat => {
          html += `<a href="#category-${encodeURIComponent(cat)}" class="category-title-btn">【${cat}】</a>`;
        });
        html += `</div>`;
        appDiv.innerHTML = html;
        return;
      }

      // カテゴリ別疾患一覧
      if (hash.startsWith('category-')) {
        const cat = decodeURIComponent(hash.replace('category-', ''));
        let html = `<div class="nav-bar"><a href="#home" class="back-btn">← トップへ</a><span class="breadcrumb">ホーム > ${cat}</span></div>`;
        html += `<h1>${cat}</h1><div class="menu-grid">`;
        if (categoryMap[cat]) {
          categoryMap[cat].forEach(id => {
            html += `<a href="#${id}" class="menu-btn">${db[id].title}</a>`;
          });
        }
        html += `</div>`;
        appDiv.innerHTML = html;
        return;
      }

      // 疾患詳細ページ
      const data = db[hash];
      if (!data) {
        appDiv.innerHTML = `<h1>404 Not Found</h1><p>ページが見つかりません。</p><a href="#home" class="back-btn">トップへ戻る</a>`;
        return;
      }

      // 1. ナビゲーション
      let html = `<div class="nav-bar">
                    <a href="javascript:history.back()" class="back-btn">← 戻る</a>
                    <span class="breadcrumb"><a href="#home">ホーム</a> > <a href="#category-${encodeURIComponent(data.category)}">${data.category}</a></span>
                  </div>
                  <h1>${data.title}</h1>`;

      // 2. フローチャート自動生成
      if (data.flowchart && data.flowchart.length > 0) {
        html += `<h2>フローチャート</h2><div class="flow-container">`;
        data.flowchart.forEach((step, idx) => {
          if (idx > 0) html += `<div class="flow-arrow">↓</div>`;
          if (step.link) {
            html += `<a href="#${step.link}" class="flow-box">${step.label}</a>`;
          } else {
            html += `<div class="flow-text">${step.label}</div>`;
          }
        });
        html += `</div>`;
      }

      // 3. ページテンプレート自動生成
      sectionTemplates.forEach(sec => {
        if (data[sec.key]) {
          html += `<h2>${sec.title}</h2><p>${data[sec.key].replace(/\n/g, '<br>')}</p>`;
        }
      });

      // 4. 口頭試問
      if (data.oralQuestions && data.oralQuestions.length > 0) {
        html += `<h2>研修医口頭試問</h2>`;
        data.oralQuestions.forEach(qa => {
          html += `<div class="qa-item"><div class="qa-q" onclick="toggleQA(this)">Q. ${qa.q}</div><div class="qa-a">${qa.a}</div></div>`;
        });
      }

      // 5. 関連項目（自動リンク生成）
      if (data.links && data.links.length > 0) {
        html += `<h2>関連項目</h2><div class="related-tags">`;
        data.links.forEach(linkId => {
          const target = db[linkId];
          if (target) {
            html += `<a href="#${linkId}" class="related-tag">${target.title}</a>`;
          } else {
            // 未登録のリンク先でもエラーにせずIDを表示
            html += `<a href="#${linkId}" class="related-tag">${linkId}</a>`;
          }
        });
        html += `</div>`;
      }

      appDiv.innerHTML = html;
    }

    // ハッシュ変更監視
    window.addEventListener('hashchange', renderApp);
    window.addEventListener('DOMContentLoaded', renderApp);


    // ==================================================
    // 2. MEDICAL CONTENT (医学コンテンツ)
    // ==================================================
    // ここから下に医学コンテンツを追加してください。
    // 登録の順序は問いません。カテゴリも自動生成されます。
    // ==================================================

    addMedicalContent({
      id: "acs",
      category: "循環器",
      title: "急性冠症候群 (ACS)",
      overview: "プラークの破綻やびらんにより冠動脈内に血栓が形成され、急激な心筋虚血を来す疾患群。<a href='#stemi' class='wiki-link'>STEMI</a>、<a href='#nstemi' class='wiki-link'>NSTEMI</a>、不安定狭心症(UA)を含む。",
      pathophysiology: "アテローム硬化巣の破綻により血小板凝集と凝固カスケードが活性化し、血栓が形成される。",
      diagnosis: "①典型的な胸痛、②12誘導ECGの虚血性変化、③高感度トロポニンの上昇。",
      oralQuestions: [
        { q: "ACSを疑った場合、最初に何を行う？", a: "10分以内の12誘導ECG取得、バイタルサインの確認、酸素投与（SpO2<90%）。" }
      ],
      links: ["stemi", "nstemi", "pci"]
    });

    addMedicalContent({
      id: "stemi",
      category: "循環器",
      title: "STEMI (ST上昇型心筋梗塞)",
      flowchart: [
        { label: "胸痛・胸部症状", link: null },
        { label: "12誘導ECG (10分以内)", link: null },
        { label: "ST上昇あり", link: null },
        { label: "STEMI確定診断", link: "stemi" },
        { label: "Primary PCI (90分以内)", link: "pci" }
      ],
      definition: "冠動脈の完全閉塞により貫壁性の心筋壊死を生じる状態。",
      treatment: "診断から90分以内のPrimary PCIが第一選択。抗血小板薬（DAPT）と抗凝固療法を併用。",
      importantPoints: "時間が心筋を救う（Time is Muscle）。",
      links: ["acs", "pci"]
    });

    addMedicalContent({
      id: "pci",
      category: "循環器",
      title: "経皮的冠動脈インターベンション (PCI)",
      overview: "カテーテルを用いて冠動脈の狭窄・閉塞病変を拡張・再開通させる治療法。",
      links: ["stemi", "acs"]
    });

    addMedicalContent({
      id: "lung-cancer",
      category: "呼吸器",
      title: "肺癌",
      flowchart: [
        { label: "肺結節", link: null },
        { label: "胸部CT", link: "chest-ct" },
        { label: "PET/CT", link: "pet-ct" },
        { label: "気管支鏡・生検", link: "bronchoscopy" },
        { label: "病理診断", link: null },
        { label: "治療方針決定", link: null }
      ],
      definition: "肺の気管支や肺胞の細胞が癌化した悪性腫瘍。小細胞肺癌と非小細胞肺癌に大別される。",
      diagnosis: "胸部X線、胸部CT、気管支鏡検査を用いた病理診断。",
      treatment: "外科的切除、放射線療法、薬物療法（細胞障害性抗癌薬、分子標的薬、免疫チェックポイント阻害薬）。",
      links: ["chest-ct", "pet-ct", "bronchoscopy"]
    });

    addMedicalContent({
      id: "chest-ct",
      category: "呼吸器",
      title: "胸部CT",
      overview: "X線を用いて肺や縦隔の断層画像を撮影する検査。微小な肺結節の検出に優れる。",
      links: ["lung-cancer"]
    });
    // ==================================================
    // 循環器領域（大幅拡充・更新版）
    // ==================================================
    
    // 1. 虚血性心疾患・冠動脈インターベンション・心臓外科
    addMedicalContent({
      id: "acs",
      category: "循環器",
      title: "急性冠症候群 (ACS)",
      overview: "冠動脈内プラークの破綻・びらんにより血栓が形成され、急激な心筋虚血を来す疾患群。<a href='#stemi' class='wiki-link'>STEMI</a>、<a href='#nstemi' class='wiki-link'>NSTEMI</a>、不安定狭心症(UA)を含む。",
      pathophysiology: "アテローム硬化巣の破綻により内皮下組織が血流に曝露。血小板凝集と凝固カスケードが活性化し、白色血栓（血小板主体）から赤色血栓（フィブリン主体）へと進展する。Type 1 MIに分類される。",
      diagnosis: "①典型的な安静時胸痛（20分以上持続）、②10分以内の12誘導ECG取得（ST変化の評価）、③高感度心筋トロポニン(hs-cTn)の測定。",
      severity: "Killip分類（肺うっ血の程度による心不全評価）および、NSTEMIにおけるGRACEリスクスコアを用いた早期侵襲的戦略の層別化が重要。",
      treatment: "抗血小板薬（アスピリン＋P2Y12阻害薬のDAPT）、抗凝固薬（未分画ヘパリン等）。早期の冠動脈造影(CAG)および血行再建（<a href='#pci' class='wiki-link'>PCI</a>または<a href='#cabg' class='wiki-link'>CABG</a>）。",
      importantPoints: "近年は出血リスク（ARC-HBR等）を評価し、DAPT期間の短縮（1〜3ヶ月）後にP2Y12阻害薬単剤へ移行するSAPT de-escalation戦略が注目されている（ESC 2023 ACS Guidelines）。",
      links: ["stemi", "nstemi", "pci", "cabg", "cardiogenic-shock"]
    });

    addMedicalContent({
      id: "stemi",
      category: "循環器",
      title: "STEMI (ST上昇型心筋梗塞)",
      flowchart: [
        { label: "突然の激しい胸痛", link: null },
        { label: "12誘導ECG (FMCから10分以内)", link: null },
        { label: "2つ以上の連続する誘導で新出ST上昇/LBBB", link: null },
        { label: "STEMI確定診断", link: "stemi" },
        { label: "Primary PCI (FMCから90分以内)", link: "pci" }
      ],
      diagnosisCriteria: "隣り合う2つ以上の誘導でのST上昇（V2-V3では男性≧0.2mV, 女性≧0.15mV、その他の誘導では≧0.1mV）、または新規発症の左脚ブロック(LBBB)。",
      treatment: "第一選択はPrimary PCI。FMC(最初の医療接触)からワイヤー通過まで90分以内（ESC 2023ではPCIセンター到着から60分以内）が目標。",
      surgery: "機械的合併症（心室中隔穿孔[VSP]、乳頭筋断裂による重症MR、左室自由壁破裂）を合併した場合は、機械的補助循環（IABP/Impella/VA-ECMO）を導入し、緊急外科手術（パッチ閉鎖術、MVR、縫合術）の絶対適応。",
      oralQuestions: [
        { q: "右室梗塞を疑う心電図変化と禁忌薬は？", a: "下壁梗塞（II, III, aVFのST上昇）に合併しやすく、V4R等の右側胸部誘導でST上昇。前負荷依存状態となるため、硝酸薬や利尿薬は血圧低下を招き禁忌。初期対応は細胞外液の負荷。" }
      ],
      links: ["acs", "pci", "cabg", "cardiogenic-shock"]
    });

    addMedicalContent({
      id: "nstemi",
      category: "循環器",
      title: "NSTEMI / 不安定狭心症",
      overview: "ST上昇を伴わないが、心筋バイオマーカー（hs-cTn）の上昇を伴う心筋虚血（NSTEMI）、またはバイオマーカー上昇を伴わない切迫した虚血（UA）。",
      diagnosis: "ESC 2023ガイドラインが推奨する「0/1時間」または「0/2時間」hs-cTnアルゴリズムによる迅速なRule-in / Rule-outが標準。",
      treatment: "リスク層別化に基づく侵襲的戦略のタイミング決定。①超高リスク（血行動態不安定、難治性胸痛、致死性不整脈）：2時間以内の緊急CAG、②高リスク（GRACEスコア>140、hs-cTn動態あり、ST-T変化）：24時間以内の早期CAG。",
      links: ["acs", "stemi", "pci"]
    });

    addMedicalContent({
      id: "pci",
      category: "循環器",
      title: "経皮的冠動脈インターベンション (PCI)",
      overview: "カテーテルを用いて冠動脈狭窄部を拡張・ステント留置し、血流を再開通させる手技。現在は第2世代以降の薬剤溶出性ステント(DES)が主流。",
      initialTests: "慢性冠症候群(CCS)に対する適応決定には、冠血流予備量比(FFR)≦0.80、または瞬時無血流比(iFR)≦0.89などの機能的虚血評価が必須。",
      treatment: "手技中の抗凝固療法（ヘパリン）。石灰化病変に対するロータブレーターやOAS(Orbital Atherectomy System)、IVL(血管内砕石術)の併用。血管内イメージング（IVUS/OCT）ガイド下でのステント最適化。",
      links: ["acs", "cabg"]
    });

    addMedicalContent({
      id: "cabg",
      category: "循環器",
